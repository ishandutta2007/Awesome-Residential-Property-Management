<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Building Gradient -->
    <linearGradient id="buildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="buildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Styles / Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -120; }
      }
      @keyframes blinkLight1 {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes blinkLight2 {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.15; }
      }
      .anim-glow {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-dash {
        stroke-dasharray: 8, 8;
        animation: dashAnim 20s linear infinite;
      }
      .anim-light-1 { animation: blinkLight1 2.4s ease-in-out infinite; }
      .anim-light-2 { animation: blinkLight2 3.1s ease-in-out infinite; }
      .anim-light-3 { animation: blinkLight1 1.8s ease-in-out infinite 0.9s; }
      .anim-light-4 { animation: blinkLight2 2.7s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="100" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)" class="anim-glow" />
  <circle cx="1060" cy="200" r="240" fill="#818cf8" opacity="0.12" filter="url(#glow)" class="anim-glow" />
  <circle cx="680" cy="340" r="160" fill="#34d399" opacity="0.07" filter="url(#glow)" class="anim-glow" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
  </g>

  <!-- Skyline Graphic (Right Side) -->
  <g class="anim-float" opacity="0.9">
    <!-- Rear Tower -->
    <polygon points="960,370 960,180 1020,140 1080,180 1080,370" fill="url(#buildingGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="1020" y1="140" x2="1020" y2="370" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

    <!-- Mid High-Rise -->
    <polygon points="870,370 870,210 930,170 990,210 990,370" fill="url(#buildingGrad2)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="930" y1="170" x2="930" y2="370" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />

    <!-- Modern Skyscraper -->
    <polygon points="1060,370 1060,100 1150,50 1240,100 1240,370" fill="url(#buildingGrad1)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="1150" y1="50" x2="1150" y2="370" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Front Multi-Unit Villa -->
    <polygon points="790,370 790,270 845,230 900,270 900,370" fill="url(#buildingGrad2)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="845" y1="230" x2="845" y2="370" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Dynamic Window Lights -->
    <circle cx="1090" cy="130" r="3" fill="#38bdf8" class="anim-light-1" />
    <circle cx="1120" cy="130" r="3" fill="#fbbf24" class="anim-light-2" />
    <circle cx="1180" cy="130" r="3" fill="#38bdf8" class="anim-light-3" />
    <circle cx="1210" cy="130" r="3" fill="#34d399" class="anim-light-1" />
    <circle cx="1090" cy="170" r="3" fill="#34d399" class="anim-light-4" />
    <circle cx="1120" cy="170" r="3" fill="#38bdf8" class="anim-light-2" />
    <circle cx="1180" cy="170" r="3" fill="#fbbf24" class="anim-light-1" />
    <circle cx="1210" cy="170" r="3" fill="#38bdf8" class="anim-light-3" />
    <circle cx="1090" cy="210" r="3" fill="#fbbf24" class="anim-light-3" />
    <circle cx="1120" cy="210" r="3" fill="#34d399" class="anim-light-4" />
    <circle cx="1180" cy="210" r="3" fill="#38bdf8" class="anim-light-2" />
    <circle cx="1210" cy="210" r="3" fill="#fbbf24" class="anim-light-1" />

    <!-- Mid Building Lights -->
    <circle cx="900" cy="240" r="2.5" fill="#818cf8" class="anim-light-2" />
    <circle cx="960" cy="240" r="2.5" fill="#38bdf8" class="anim-light-1" />
    <circle cx="900" cy="280" r="2.5" fill="#34d399" class="anim-light-3" />
    <circle cx="960" cy="280" r="2.5" fill="#818cf8" class="anim-light-4" />
  </g>

  <!-- Flow / Circuit Connections -->
  <path d="M 580,240 C 700,240 750,190 840,245 S 970,255 1060,200" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="anim-dash" opacity="0.65" />
  <path d="M 520,290 C 660,290 730,320 820,290 S 930,230 1000,250" fill="none" stroke="#38bdf8" stroke-width="1.5" class="anim-dash" opacity="0.35" />

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Badge -->
    <g transform="translate(0, 60)">
      <rect width="265" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="18" cy="16" r="5" fill="#10b981" class="anim-light-1" filter="url(#glowSubtle)" />
      <text x="32" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">CURATED PROPTECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Residential
    </text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Property Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
      The definitive directory of commercial SaaS platforms &amp; open-source rental software.
    </text>

    <!-- Capability Chips -->
    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">💳 Rent Collection</text>
      </g>
      <g transform="translate(155, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">🔑 Tenant Portals</text>
      </g>
      <g transform="translate(305, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">📋 Digital Leases</text>
      </g>
      <g transform="translate(450, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">🛠️ Work Orders</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">
        ⭐ Top Category Leaders &#x2022; 📊 Transparent Pricing &#x2022; 🔓 Self-Hosted Repos &#x2022; 📈 Star History
      </text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="396" width="1280" height="4" fill="url(#accentGrad)" />
</svg>